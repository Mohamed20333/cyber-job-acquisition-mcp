name: LinkedIn Cloud MCP Build
on:
  push:
    branches: [main]
    paths: ["linkedin-cloud-mcp/**"]
  pull_request:
    paths: ["linkedin-cloud-mcp/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkedin-cloud-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linkedin-cloud-mcp/package.json
      - run: npm install
      - run: npm run build
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: linkedin-cloud-mcp
          command: deploy --config wrangler.toml
