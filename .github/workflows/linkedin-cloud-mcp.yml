name: LinkedIn Cloud MCP Build
on:
  push:
    branches: [main]
    paths: ["linkedin-cloud-mcp/**"]
  pull_request:
    paths: ["linkedin-cloud-mcp/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkedin-cloud-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: linkedin-cloud-mcp/package.json
      - run: npm install
      - id: build
        run: npm run build
      - name: Capture TypeScript diagnostics
        if: steps.build.outcome == 'failure'
        working-directory: .
        run: |
          cd linkedin-cloud-mcp
          npx tsc --noEmit --pretty false > ../.ci-build-error.log 2>&1 || true
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-build-error.log
          git commit -m "[skip ci] capture LinkedIn MCP build diagnostics" || true
          git push || true
      - name: Deploy to Cloudflare
        if: success()
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: linkedin-cloud-mcp
          command: deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
