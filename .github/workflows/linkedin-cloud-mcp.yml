name: LinkedIn Cloud MCP Build

on:
  push:
    paths:
      - "linkedin-cloud-mcp/**"
  pull_request:
    paths:
      - "linkedin-cloud-mcp/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkedin-cloud-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: linkedin-cloud-mcp/package.json
      - run: npm install
      - run: npm run build
