name: LinkedIn Agent Build

on:
  push:
    paths:
      - "linkedin-agent/**"
  pull_request:
    paths:
      - "linkedin-agent/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkedin-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: linkedin-agent/package.json
      - run: npm install
      - run: npm run build
